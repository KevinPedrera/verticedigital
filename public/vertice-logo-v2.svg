<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Gradiente Morado Real Vértice Profundo -->
    <linearGradient id="v2Purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e2c58" />
      <stop offset="60%" stop-color="#2d1a32" />
      <stop offset="100%" stop-color="#190e1c" />
    </linearGradient>

    <!-- Gradiente Terracota Acento Lujoso -->
    <linearGradient id="v2Terra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f29582" />
      <stop offset="50%" stop-color="#d5644f" />
      <stop offset="100%" stop-color="#a33723" />
    </linearGradient>

    <!-- Gradiente Platino / Acero Pulido -->
    <linearGradient id="v2Steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e9e2ec" />
      <stop offset="100%" stop-color="#beb0c4" />
    </linearGradient>

    <!-- Sombra Flotante de Alta Jerarquía -->
    <filter id="v2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2d1a32" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d5644f" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ==============================================
       PROPUESTA 2: MONOGRAMA DIAMANTE CRIPTOGRÁFICO
       (Inspirado en arquitectura paramétrica y alta relojería)
       ============================================== -->

  <!-- Aro sutil de equilibrio y precisión matemática -->
  <circle cx="100" cy="100" r="90" stroke="#ddd2de" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.6" />
  <circle cx="100" cy="100" r="82" stroke="url(#v2Purple)" stroke-width="0.8" opacity="0.3" />

  <!-- Grupo Principal con Sombra de Elevación -->
  <g filter="url(#v2Shadow)">
    
    <!-- 1. ALA IZQUIERDA: CINTA DE INGENIERÍA Y RIGOR (MORADO PROFUNDO) -->
    <!-- Brazo exterior izquierdo -->
    <path d="M42 45 
             L72 45 
             L100 135 
             L82 135 
             L42 45 Z" 
          fill="url(#v2Purple)" />

    <!-- Bisel de iluminación superior del brazo izquierdo -->
    <path d="M42 45 
             L72 45 
             L68 55 
             L38 55 Z" 
          fill="url(#v2Steel)" 
          opacity="0.9" />

    <!-- Faceta interior sombreada para profundidad 3D -->
    <path d="M72 45 
             L100 135 
             L92 135 
             L66 55 Z" 
          fill="#170d19" 
          opacity="0.5" />

    <!-- 2. ALA DERECHA: CINTA DE DISEÑO Y ESTRATEGIA (TERRACOTA ACCENT) -->
    <!-- Brazo exterior derecho -->
    <path d="M158 45 
             L128 45 
             L100 135 
             L118 135 
             L158 45 Z" 
          fill="url(#v2Terra)" />

    <!-- Bisel de iluminación superior del brazo derecho -->
    <path d="M158 45 
             L128 45 
             L132 55 
             L162 55 Z" 
          fill="#ffffff" 
          opacity="0.45" />

    <!-- Arista viva de luz en la caída derecha -->
    <path d="M128 45 
             L134 55 
             L108 135 
             L100 135 Z" 
          fill="#ffffff" 
          opacity="0.25" />

    <!-- 3. EL VÉRTICE SUPERIOR: DIAMANTE DE ENLACE Y CUMBRE -->
    <!-- Rombo flotante superior de coronación -->
    <polygon points="100,32 114,48 100,64 86,48" fill="url(#v2Terra)" />
    <!-- Faceta iluminada del diamante -->
    <polygon points="100,32 114,48 100,48 86,48" fill="#ffffff" opacity="0.6" />
    <polygon points="100,48 114,48 100,64 86,48" fill="#a83521" opacity="0.5" />
    <!-- Punto central de calibración -->
    <circle cx="100" cy="48" r="2.5" fill="#ffffff" />

    <!-- 4. NÚCLEO INFERIOR: CANDADO DE CONVERGENCIA -->
    <!-- Vértice afilado con remache de precisión -->
    <polygon points="100,128 106,140 100,154 94,140" fill="url(#v2Terra)" />
    <circle cx="100" cy="140" r="3" fill="#ffffff" />
    
  </g>
</svg>
