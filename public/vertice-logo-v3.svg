<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Gradientes de Facetas Isométricas -->
    <linearGradient id="p3Top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ebe3ee" />
      <stop offset="100%" stop-color="#cdbed2" />
    </linearGradient>

    <linearGradient id="p3Left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#462a4e" />
      <stop offset="50%" stop-color="#2d1a32" />
      <stop offset="100%" stop-color="#190e1c" />
    </linearGradient>

    <linearGradient id="p3Right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59c8a" />
      <stop offset="45%" stop-color="#d5644f" />
      <stop offset="100%" stop-color="#9a321f" />
    </linearGradient>

    <!-- Sombra Isométrica de Cimiento -->
    <filter id="p3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2d1a32" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#d5644f" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ==============================================
       PROPUESTA 3: EL PRISMA ARQUITECTÓNICO ISOMÉTRICO
       (Monolito tridimensional de alta solidez institucional)
       ============================================== -->

  <!-- Hexágono base sutil de calibración técnica -->
  <polygon points="100,16 172,58 172,142 100,184 28,142 28,58" 
           stroke="#ddd2de" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5" />

  <g filter="url(#p3Shadow)">
    
    <!-- 1. BLOQUE PRINCIPAL IZQUIERDO: MORADO INSTITUCIONAL -->
    <!-- Cara Frontal Izquierda -->
    <path d="M46 54 
             L78 54 
             L100 138 
             L84 138 
             L46 54 Z" 
          fill="url(#p3Left)" />

    <!-- Cara Biselada Superior Izquierda (Reflejo Platino) -->
    <polygon points="46,54 78,54 88,40 56,40" fill="url(#p3Top)" opacity="0.95" />

    <!-- Cara Interior de Profundidad (Corte Diamante) -->
    <polygon points="78,54 88,40 100,120 100,138" fill="#150b17" opacity="0.6" />

    <!-- 2. BLOQUE PRINCIPAL DERECHO: TERRACOTA DE PRECISIÓN -->
    <!-- Cara Frontal Derecha -->
    <path d="M154 54 
             L122 54 
             L100 138 
             L116 138 
             L154 54 Z" 
          fill="url(#p3Right)" />

    <!-- Cara Biselada Superior Derecha -->
    <polygon points="154,54 122,54 112,40 144,40" fill="#f0ad92" />

    <!-- Cara Interior de Profundidad Derecha -->
    <polygon points="122,54 112,40 100,120 100,138" fill="#7d2818" opacity="0.5" />

    <!-- 3. CÚSPIDE CENTRAL: EL VÉRTICE GEOMÉTRICO -->
    <!-- Prisma Superior de Anclaje -->
    <polygon points="100,26 112,40 100,54 88,40" fill="url(#p3Right)" />
    <polygon points="100,26 112,40 100,40 88,40" fill="#ffffff" opacity="0.75" />
    <polygon points="88,40 100,40 100,54" fill="url(#p3Left)" opacity="0.85" />

    <!-- 4. PUNTA INFERIOR / QUEMADOR DE PRECISIÓN -->
    <polygon points="100,138 107,152 100,166 93,152" fill="url(#p3Right)" />
    <polygon points="100,138 107,152 100,152 93,152" fill="#ffffff" opacity="0.6" />
    
    <!-- Micro remache de seguridad central -->
    <circle cx="100" cy="152" r="2.5" fill="#2d1a32" />
  </g>
</svg>
